name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run tests
        working-directory: kicad-drc-wasm
        run: |
          # Run core test suite
          npm test

      - name: Build release bundles (dry run)
        run: node scripts/build-releases.mjs

      - name: Verify release artifacts
        run: |
          ls -la dist/
          test -d "dist/kicad-wasm-utilities-0.1.0" || exit 1
          echo "Release bundles created successfully"
