name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Tests and release bundles expect the WASM binary at
      # kicad-drc-wasm/build-wasm-erc/, which is a (gitignored) emsdk build
      # output. CI can't run that toolchain, so stage the committed demo
      # binary from public/ instead — it's the same single-threaded build.
      - name: Stage WASM binary
        run: |
          mkdir -p kicad-drc-wasm/build-wasm-erc
          cp public/kicad_drc.mjs public/kicad_drc.wasm kicad-drc-wasm/build-wasm-erc/

      - name: Run tests
        working-directory: kicad-drc-wasm
        run: |
          # Run core test suite
          npm test

      - name: Build release bundles (dry run)
        run: node scripts/build-releases.mjs

      - name: Verify release artifacts
        run: |
          ls -la dist/
          test -d "dist/kicad-wasm-utilities-0.1.0" || exit 1
          echo "Release bundles created successfully"
